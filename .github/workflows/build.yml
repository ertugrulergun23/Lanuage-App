name: Flutter APK Build

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Repair Android Project, Apply Native Patches & Build
        run: |
          # ── Step 1: Wipe & regenerate the Android project skeleton ────────────
          rm -rf android
          flutter create . --platforms=android --project-name=language_app

          # ── Step 2: Apply native patches from android_patches/ ────────────────
          #
          # android_patches/ is committed to the repository and contains all
          # hand-crafted native files that flutter create would not generate:
          #   • AndroidManifest.xml  — includes INTERNET permission + popup Activity
          #   • styles.xml           — translucent theme for TranslatePopupActivity
          #   • MainActivity.kt      — adds FlutterEngine pre-warm logic
          #   • TranslatePopupActivity.kt — handles ACTION_PROCESS_TEXT
          #
          # The INTERNET permission is declared directly in
          # android_patches/AndroidManifest.xml, so no sed injection needed.

          # 2a. Replace the generated manifest with our patched version
          cp android_patches/app/src/main/AndroidManifest.xml \
             android/app/src/main/AndroidManifest.xml

          # 2b. Inject Theme.TranslatePopup into the generated styles.xml
          #     (cp would OVERWRITE LaunchTheme/NormalTheme — use sed instead)
          #
          #     Strategy: write the style block to a temp file, then use sed to
          #     insert it before the closing </resources> tag so the
          #     flutter-generated LaunchTheme and NormalTheme are preserved.
          python3 - <<'PYEOF'
import re

style_block = """
    <!-- Theme.TranslatePopup — injected by CI for ACTION_PROCESS_TEXT popup -->
    <style name="Theme.TranslatePopup" parent="@android:style/Theme.Translucent.NoTitleBar">
        <item name="android:windowIsFloating">true</item>
        <item name="android:windowBackground">@android:color/transparent</item>
        <item name="android:backgroundDimEnabled">true</item>
        <item name="android:backgroundDimAmount">0.5</item>
        <item name="android:windowAnimationStyle">@android:style/Animation.Dialog</item>
        <item name="android:windowMinWidthMajor">0%</item>
        <item name="android:windowMinWidthMinor">0%</item>
    </style>
"""

path = "android/app/src/main/res/values/styles.xml"
content = open(path).read()

# Only inject if not already present (idempotent)
if "Theme.TranslatePopup" not in content:
    content = content.replace("</resources>", style_block + "\n</resources>")
    open(path, "w").write(content)
    print("Theme.TranslatePopup injected into styles.xml")
else:
    print("Theme.TranslatePopup already present, skipping injection")
PYEOF

          # 2c. Copy Kotlin source files (MainActivity + TranslatePopupActivity)
          mkdir -p android/app/src/main/kotlin/com/example/language_app
          cp android_patches/app/src/main/kotlin/com/example/language_app/MainActivity.kt \
             android/app/src/main/kotlin/com/example/language_app/MainActivity.kt
          cp android_patches/app/src/main/kotlin/com/example/language_app/TranslatePopupActivity.kt \
             android/app/src/main/kotlin/com/example/language_app/TranslatePopupActivity.kt

          # ── Step 3: Fetch deps & build ────────────────────────────────────────
          flutter pub get
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk